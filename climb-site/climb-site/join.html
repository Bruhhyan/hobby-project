<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a Session | Chalk & Stone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-climb fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Chalk &amp; Stone</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Rock Climbing</a></li>
          <li class="nav-item"><a class="nav-link" href="log.html">Grades &amp; Log</a></li>
          <li class="nav-item"><a class="nav-link active" href="join.html">Join a Session</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="section" style="padding-top: 6rem;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <p class="section-eyebrow">Let's climb together</p>
          <h1 class="mb-3">Join a Session</h1>
          <p class="mb-4">
            Tell me your level and when you're free.
          </p>

          <!-- ============================================
               THE FORM
               Note: no "action" attribute and type="button"
               on submit (not type="submit") — this stops the
               page from reloading, since we're handling the
               response entirely with JavaScript below.
               ============================================ -->
          <form id="joinForm" class="form-climb">
            <div class="mb-3">
              <label for="climberName" class="form-label">Your name</label>
              <input type="text" class="form-control" id="climberName" required>
            </div>

            <div class="mb-3">
              <label for="climberGrade" class="form-label">Your climbing level</label>
              <select class="form-select" id="climberGrade" required>
                <option value="" selected disabled>Choose your level</option>
                <option value="Beginner (V0–V2)">Beginner (V0&ndash;V2)</option>
                <option value="Intermediate (V3–V5)">Intermediate (V3&ndash;V5)</option>
                <option value="Advanced (V6+)">Advanced (V6+)</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label d-block">Preferred setting</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="setting" id="settingIndoor" value="Indoor" checked>
                <label class="form-check-label" for="settingIndoor">Indoor</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="setting" id="settingOutdoor" value="Outdoor">
                <label class="form-check-label" for="settingOutdoor">Outdoor</label>
              </div>
            </div>

            <div class="mb-3">
              <label for="availability" class="form-label">When are you free?</label>
              <input type="text" class="form-control" id="availability" placeholder="e.g. Weekday evenings, Sat mornings" required>
            </div>

            <div class="mb-4">
              <label for="message" class="form-label">Anything else?</label>
              <textarea class="form-control" id="message" rows="3" placeholder="Optional"></textarea>
            </div>

            <button type="button" class="btn btn-rope" onclick="handleJoinSubmit()">Send request</button>
          </form>

          <!-- ============================================
               THE RESPONSE PAGE (same-page version)
               Hidden by default via CSS (#response-card
               { display: none; }). JavaScript below reveals
               it and fills it with the data the user typed.
               This satisfies "a response page to show the
               data entered in the form."
               ============================================ -->
          <div id="response-card">
            <span class="grade-tape">Request received</span>
            <h3 id="responseHeading" class="mt-2" style="color: var(--chalk);"></h3>
            <p id="responseBody"></p>
          </div>

        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p>my socials :</p>
    <a href="https://www.instagram.com/bruhbruyan/" target="_blank" style="color: var(--chalk-dim);">
      <i class="bi bi-instagram"></i>
    </a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ============================================
    // FORM PROCESSING WITH JAVASCRIPT
    // Reads each field's value, validates the required
    // ones are filled in, then builds a sentence from the
    // data and displays it in the response card.
    // ============================================
    function handleJoinSubmit() {
      // 1. Read every field's current value
      let name = document.getElementById("climberName").value;
      let grade = document.getElementById("climberGrade").value;
      let setting = document.querySelector('input[name="setting"]:checked').value;
      let availability = document.getElementById("availability").value;
      let message = document.getElementById("message").value;

      // 2. Basic validation — the required fields must not be empty
      if (name === "" || grade === "" || availability === "") {
        alert("Please fill in your name, level, and availability before sending.");
        return; // stop here, don't show the response
      }

      // 3. Build the confirmation text from the form data
      let heading = "Thanks, " + name + "!";
      let body = "We've noted you're a " + grade + " climber, looking for " +
                 setting.toLowerCase() + " sessions, available: " + availability + ".";

      if (message !== "") {
        body += " Your note: \u201c" + message + "\u201d";
      }

      // 4. Write it into the response card and reveal it
      document.getElementById("responseHeading").textContent = heading;
      document.getElementById("responseBody").textContent = body;
      document.getElementById("response-card").style.display = "block";

      // 5. Scroll the response into view
      document.getElementById("response-card").scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
